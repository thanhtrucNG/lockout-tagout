<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="1720" cy="450" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d5a82" stop-opacity=".85"/>
      <stop offset=".55" stop-color="#0d3a5a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#06263d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="24" cy="24" r="1.4" fill="#c7ddea" fill-opacity=".16"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridMask"><rect width="2400" height="900" fill="url(#fade)"/></mask>
  </defs>
  <rect width="2400" height="900" fill="#06263d"/>
  <rect width="2400" height="900" fill="url(#glow)"/>
  <rect width="2400" height="900" fill="url(#grid)" mask="url(#gridMask)"/>
  <!-- Sensor rings: a gas detector's reading spreading out from the cylinders. -->
  <g fill="none" stroke="#c7ddea" stroke-width="1.5">
    <circle cx="1720" cy="450" r="330" stroke-opacity=".20"/>
    <circle cx="1720" cy="450" r="440" stroke-opacity=".14"/>
    <circle cx="1720" cy="450" r="560" stroke-opacity=".09"/>
    <circle cx="1720" cy="450" r="690" stroke-opacity=".05"/>
  </g>
  <g fill="none" stroke="#e63720" stroke-width="3" stroke-linecap="round" stroke-opacity=".75">
    <path d="M1720 120a330 330 0 0 1 318 242"/>
  </g>
  <!-- Molecule marks (N₂ / O₂ style pairs) scattered in the right half. -->
  <g fill="#c7ddea" fill-opacity=".30" stroke="#c7ddea" stroke-opacity=".30" stroke-width="2">
    <line x1="1250" y1="170" x2="1282" y2="150"/><circle cx="1250" cy="170" r="7"/><circle cx="1282" cy="150" r="7"/>
    <line x1="2170" y1="210" x2="2206" y2="226"/><circle cx="2170" cy="210" r="8"/><circle cx="2206" cy="226" r="8"/>
    <line x1="2230" y1="700" x2="2262" y2="680"/><circle cx="2230" cy="700" r="6"/><circle cx="2262" cy="680" r="6"/>
    <line x1="1320" y1="760" x2="1346" y2="784"/><line x1="1346" y1="784" x2="1376" y2="770"/><circle cx="1320" cy="760" r="6"/><circle cx="1346" cy="784" r="8"/><circle cx="1376" cy="770" r="6"/>
    <line x1="2050" y1="820" x2="2080" y2="836"/><circle cx="2050" cy="820" r="5"/><circle cx="2080" cy="836" r="5"/>
  </g>
</svg>
